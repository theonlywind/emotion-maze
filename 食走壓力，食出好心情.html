<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食走壓力，食出好心情</title>
<style>
/* 攤位螢幕用：黑底霓虹色，經典街機視覺語言（GDD 第 6 章） */

:root {
  --neon: #3f6dff;
  --warm: #ffd93d;
  --calm: #8fe9ff;
  --ink: #eef2ff;
  --bg: #05060f;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: #000;
  color: var(--ink);
  font-family: system-ui, "PingFang HK", "Microsoft JhengHei", sans-serif;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#stage {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
}

/* [試驗] 文字同介面跟住畫面大細放大（--ui-hud / --ui-panel 由 Layout.fit() 設定）。
   zoom 會連埋字、間距、圖一齊放大，排版比例保持同以前一樣。
   還原：刪走呢段同 ui.js 嘅 Layout，#frame 闊度改返 main 嘅版本。 */
#hud { zoom: var(--ui-hud, 1); }
.panel > *, .floating, .goal-hint { zoom: var(--ui-panel, 1); }
.goal-hint { width: max-content; }   /* 放大之後唔好因為 left:50% 而被逼斷行 */
.staff-card { zoom: var(--ui-panel, 1); }

/* [試驗] 闊度由 ui.js 嘅 Layout.fit() 按視窗計（量埋 HUD 實際高度），用盡成個視窗。
   呢度只係 JS 未行之前嘅後備值。 */
#frame {
  width: min(98vw, calc((98vh - 110px) * 1.88));
  container-type: inline-size;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* ---------------- HUD ---------------- */

#hud {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 6px 10px;
  border: 2px solid var(--neon);
  border-radius: 8px;
  background: #070a1c;
  visibility: hidden;
}
#hud.visible { visibility: visible; }

.hud-label { font-size: 14px; opacity: .7; display: block; }

.hud-left { text-align: center; min-width: 76px; }
#time {
  font-family: "Courier New", monospace;
  font-size: 44px;
  font-weight: bold;
  color: var(--warm);
  line-height: 1;
}
#time.low { color: #ffa24d; }

.hud-mid { flex: 1; min-width: 0; }

.progress {
  height: 12px;
  background: #131a3d;
  border-radius: 6px;
  overflow: hidden;
}
#progressFill {
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #6ee7ff, #ffd93d);
  transition: width .2s ease-out;
}

.hud-stats {
  display: flex;
  align-items: center;
  gap: 24px;
  white-space: nowrap;
  font-size: 24px;
  font-weight: bold;
  margin-top: 6px;
}
.hud-stats b { color: var(--warm); font-family: "Courier New", monospace; }
.hud-soothe { display: flex; align-items: center; gap: 8px; }
#soothedSlots { display: inline-flex; gap: 6px; }
.soothe-slot {
  position: relative;
  width: 36px;
  height: 36px;
  border: 2px dashed #3a4585;
  border-radius: 50%;
}
.soothe-slot.done { border: 2px solid var(--warm); background: rgba(255, 217, 61, .15); }
.soothe-slot img { width: 100%; height: 100%; object-fit: contain; }
.soothe-slot i {
  position: absolute;
  right: -6px;
  bottom: -6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #3ddc84;
  color: #04210f;
  font-style: normal;
  font-size: 13px;
  line-height: 18px;
  text-align: center;
}

/* ---- 每位玩家嘅即時安心值 ---- */

.hud-players {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}
.pbar {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 7px;
  border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  border-radius: 6px;
  background: rgba(10, 14, 38, .7);
}
.pbar.offline { opacity: .4; }
.pbar.out { opacity: .35; }

.pbar-head { display: flex; align-items: baseline; gap: 8px; }
.pbar-score {
  font-family: "Courier New", monospace;
  font-size: 20px;
  font-weight: bold;
  color: var(--c);
  line-height: 1;
}
.pbar-name {
  font-family: "Courier New", monospace;
  font-size: 18px;
  font-weight: bold;
  color: var(--c);
  line-height: 1;
}
.pbar-pips { display: flex; gap: 2px; }
.pbar-pips i {
  font-style: normal;
  font-size: 26px;
  line-height: 1;
  color: #2a3466;
  transition: color .25s;
}
.pbar-pips i.on { color: #ff5a7a; }

/* ---------------- 畫面 ---------------- */

#canvasWrap {
  position: relative;
  border: 2px solid var(--neon);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg);
}

#game {
  display: block;
  width: 100%;
  height: auto;
  image-rendering: pixelated;
}

/* ---------------- 浮動提示 ---------------- */

.floating {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 22px;
  border-radius: 999px;
  font-size: 24px;
  font-weight: bold;
  background: rgba(255, 248, 230, .95);
  color: #2b2415;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
  white-space: nowrap;
  max-width: 92%;
}
.floating.visible { opacity: 1; }
.floating.top { top: 10px; background: rgba(255, 217, 61, .95); }
.floating.top2 { top: 72px; background: rgba(143, 233, 255, .95); }
.floating.bottom { bottom: 14px; }

/* 畫面窄（細螢幕／4 人局）：HUD 收細少少，確保唔會斷行或者爆出畫面 */
@container (max-width: 950px) {
  .hud-left { min-width: 60px; }
  #time { font-size: 36px; }
  .hud-stats { font-size: 20px; gap: 14px; }
  .soothe-slot { width: 30px; height: 30px; }
  .soothe-slot i { width: 15px; height: 15px; font-size: 11px; line-height: 15px; right: -5px; bottom: -5px; }
  .pbar { padding: 3px 6px; }
  .pbar-name { font-size: 14px; }
  .pbar-pips i { font-size: 20px; }
  #hud { gap: 10px; }
  .hud-players { gap: 5px; }
}

/* 開局／食咗安撫代幣嘅大字目標提示 */
.goal-hint {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  max-width: 94%;
  padding: 10px 26px;
  border-radius: 999px;
  background: rgba(143, 233, 255, .96);
  color: #04222b;
  font-size: 26px;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 0 24px rgba(143, 233, 255, .6);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
  z-index: 6;
}
.goal-hint.visible { opacity: 1; }

/* 被掂到：紅邊閃一下 + 輕微震動，單次 0.5 秒 */
#hitFlash {
  position: absolute;
  inset: 0;
  border-radius: 6px;
  pointer-events: none;
  box-shadow: inset 0 0 0 0 rgba(255, 70, 90, 0);
  z-index: 7;
}
#hitFlash.hit { animation: hit-flash .5s ease-out; }
@keyframes hit-flash {
  0% { box-shadow: inset 0 0 70px 22px rgba(255, 70, 90, .8); }
  100% { box-shadow: inset 0 0 70px 22px rgba(255, 70, 90, 0); }
}
#canvasWrap.hit { animation: hit-shake .3s ease-out; }
@keyframes hit-shake {
  0%, 100% { transform: translate(0, 0); }
  20% { transform: translate(-5px, 2px); }
  40% { transform: translate(5px, -2px); }
  60% { transform: translate(-3px, 1px); }
  80% { transform: translate(3px, -1px); }
}
@media (prefers-reduced-motion: reduce) {
  #canvasWrap.hit { animation: none; }
}

/* ---------------- 全螢幕面板 ---------------- */

.panel {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  /* 內容多過畫面高度嗰陣照樣由頂開始，唔會被 center 切走上半截 */
  justify-content: safe center;
  overflow-y: auto;
  scrollbar-width: none;          /* 攤位畫面唔想見到 scrollbar */
  gap: 8px;
  padding: 16px;
  text-align: center;
  background: rgba(5, 6, 15, .92);
}
.panel::-webkit-scrollbar { display: none; }
.panel.visible { display: flex; }

.attract-title { font-size: clamp(20px, 5.6vw, 34px); color: var(--warm); font-weight: bold; letter-spacing: 2px; }
.attract-sub { font-size: 15px; color: var(--calm); letter-spacing: 4px; }
.attract-prompt {
  margin-top: 18px;
  font-size: 18px;
  color: var(--ink);
  animation: blink 1.4s steps(2, start) infinite;
}
.attract-hint { font-size: 12px; opacity: .55; }

@keyframes blink { 50% { opacity: .25; } }

/* ---- 開始畫面選單 ---- */

.menu {
  list-style: none;
  padding: 0;
  margin: 10px 0 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.menu-item {
  font-size: 16px;
  padding: 4px 26px;
  color: #9fb0e8;
  position: relative;
}
.menu-item.active { color: var(--warm); }
.menu-item.active::before {
  content: '▶';
  position: absolute;
  left: 6px;
  animation: blink 1s steps(2, start) infinite;
}

/* ---- 開局前精簡角色介紹 ---- */

#preInfoPanel .info-line { font-size: clamp(15px, 2.3vw, 21px); }

.pre-chars {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: center;
  gap: 8px 2.5%;
  margin-top: 4px;
}
.pre-char { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pre-pair { display: flex; align-items: center; gap: 4px; }
/* 跟住畫面闊度縮放，細螢幕唔會迫到摺行，大螢幕又唔會得粒豆咁細 */
.pre-pair img {
  width: clamp(30px, 5vw, 54px);
  aspect-ratio: 1;
  height: auto;
  image-rendering: pixelated;
}
.pre-pair img.soothed { filter: drop-shadow(0 0 6px rgba(255, 216, 150, .85)); }
.pre-arrow { color: #6a7bc8; font-size: 12px; }
.pre-name { font-size: 13px; color: var(--warm); }
.pre-caption {
  flex-basis: 100%;
  text-align: center;
  font-size: 12px;
  color: #9fb0e8;
}

/* ---- 角色介紹 / 手掣連接 共用 ---- */

.sub-title { font-size: 18px; color: var(--calm); letter-spacing: 1px; }
.sub-footer { font-size: 12px; color: #9fb0e8; max-width: 90%; line-height: 1.6; }
.sub-hint { font-size: 11px; opacity: .5; }

/* ---- 角色介紹 ---- */

/* 橫向畫面：四張卡排 2x2，用返闊度、慳返高度 */
.char-cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 10px;
  width: 96%;
}
.char-card {
  background: rgba(20, 26, 60, .75);
  border: 1px solid #26306a;
  border-radius: 8px;
  padding: 4px 6px;
}
/* 加咗安撫代幣格仔之後內容多咗，呢個版面整體縮細少少，確保一版睇晒（唔刪字） */
#charactersPanel { gap: 4px; padding: 10px 16px; }
#charactersPanel > * { zoom: calc(var(--ui-panel, 1) * 0.86); }

.token-card {
  grid-column: 1 / -1;          /* 成行闊，放喺四張角色卡下面 */
  text-align: left;
  padding: 6px 12px;
  border-color: #3a6fb0;
}
.token-head { display: flex; align-items: center; gap: 8px; }
.token-head b { font-size: 15px; color: var(--calm); }
.token-orb {                     /* 模仿迷宮入面發光嘅安撫代幣 */
  width: 14px; height: 14px; border-radius: 50%;
  background: radial-gradient(circle, #e9fdff 0 35%, #6ee7ff 60%, rgba(110, 231, 255, 0) 72%);
  box-shadow: 0 0 8px 2px rgba(110, 231, 255, .6);
}
.token-intro { font-size: 12px; color: #cfd8ff; margin: 2px 0; }
.token-ways { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }
.token-ways li { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 1.45; color: var(--ink); }
.token-ways li i { flex: none; width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; }
.token-foot { font-size: 12px; color: var(--warm); margin-top: 3px; }

.char-head {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 12px;
}
.char-head b { font-size: 15px; color: var(--warm); }
.char-head span { color: #9fb0e8; }

.char-strip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 2px 0;
}
.char-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  width: 30%;
}
.char-state img {
  width: clamp(28px, 3.4vw, 44px);
  aspect-ratio: 1;
  height: auto;
  image-rendering: pixelated;
}
.char-state span { font-size: 9px; color: #8a99d0; text-align: center; line-height: 1.3; }
.char-state.soothed span { color: #ffd9a0; }
.char-arrow { color: #4c5da8; font-size: 10px; }

.char-line { font-size: 11px; color: #cfd8ff; text-align: center; }

/* ---- 手掣連接（參考 Switch）---- */

/* 橫向畫面：四格排成一行，同 Switch 嗰個手掣畫面一樣 */
.pad-slots {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  width: 96%;
  margin: 2px 0;
}
.pad-slot {
  border: 2px solid #26306a;
  border-radius: 10px;
  padding: 8px 6px;
  text-align: center;
  background: rgba(12, 16, 44, .8);
  transition: border-color .15s, box-shadow .15s;
}
.pad-slot.on { border-color: var(--slot-color); }
.pad-slot.active { box-shadow: 0 0 0 3px color-mix(in srgb, var(--slot-color) 45%, transparent); }
.pad-slot.disabled { opacity: .35; }

.pad-num { font-family: "Courier New", monospace; font-weight: bold; font-size: 15px; color: #5d6ba8; }
.pad-slot.on .pad-num { color: var(--slot-color); }

/* 手掣圖示：一個圓角長方形 + 兩個搖桿 */
.pad-icon {
  width: 56px;
  height: 30px;
  margin: 5px auto;
  border: 2px solid #3a4788;
  border-radius: 9px / 11px;
  position: relative;
}
.pad-slot.on .pad-icon { border-color: var(--slot-color); }
.pad-icon::before, .pad-icon::after {
  content: '';
  position: absolute;
  top: 7px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #3a4788;
}
.pad-icon::before { left: 6px; }
.pad-icon::after { right: 6px; }
.pad-slot.on .pad-icon::before, .pad-slot.on .pad-icon::after { background: var(--slot-color); }

.pad-name { font-size: 10px; color: #a9b5e0; line-height: 1.4; min-height: 26px; }
.pad-status { font-size: 10px; color: #5d6ba8; margin-top: 2px; }
.pad-slot.on .pad-status { color: var(--slot-color); }

.info-line {
  font-size: clamp(17px, 4.4vw, 24px);
  line-height: 1.7;
  color: var(--ink);
  max-width: 88%;
}

.end-message { font-size: clamp(17px, 4.4vw, 24px); color: var(--warm); line-height: 1.6; max-width: 90%; white-space: pre-line; }
.end-message.game-over { color: #ff8a8a; }
.end-scores { list-style: none; padding: 0; margin: 4px 0 0; font-size: 22px; font-weight: bold; line-height: 1.7; }

.board-title { font-size: 20px; color: var(--calm); letter-spacing: 2px; }
.board-list {
  list-style: none;
  padding: 0;
  margin: 0;
  width: min(240px, 78%);
  font-family: "Courier New", monospace;
  font-size: 16px;
}
.board-list li { display: flex; gap: 12px; padding: 3px 0; border-bottom: 1px dashed #1d2650; }
.board-list li.empty { justify-content: center; border: 0; font-family: inherit; font-size: 14px; opacity: .7; }
.board-list .rank { color: #6d7bbd; }
.board-list .name { flex: 1; text-align: left; color: var(--ink); letter-spacing: 3px; }
.board-list .score { color: var(--warm); }

.entry-player {
  font-family: "Courier New", monospace;
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 2px;
}
.entry-title { font-size: 17px; color: var(--calm); line-height: 1.6; max-width: 90%; }
.entry-score { font-size: 14px; opacity: .8; }
.entry-score b { color: var(--warm); font-family: "Courier New", monospace; font-size: 20px; }
.entry-letters { display: flex; gap: 8px; margin-top: 6px; }
.entry-letters .letter {
  width: 38px;
  height: 52px;
  display: grid;
  place-items: center;
  font-family: "Courier New", monospace;
  font-size: 30px;
  border-bottom: 4px solid #26306a;
  color: var(--ink);
}
.entry-letters .letter.active {
  border-bottom-color: var(--warm);
  color: var(--warm);
  animation: blink 1s steps(2, start) infinite;
}
.entry-hint { font-size: 12px; opacity: .6; line-height: 1.7; }

/* ---------------- 志工設定 ---------------- */

#staffMenu {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, .82);
  z-index: 50;
}
#staffMenu.visible { display: flex; }

.staff-card {
  width: min(420px, 92vw);
  background: #0d1230;
  border: 2px solid var(--neon);
  border-radius: 12px;
  padding: 22px;
}
.staff-card h2 { margin: 0 0 16px; font-size: 19px; color: var(--calm); }

.staff-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 15px;
}
.staff-control { display: flex; align-items: center; gap: 10px; }
.staff-control b { min-width: 74px; text-align: center; color: var(--warm); font-family: "Courier New", monospace; }

.staff-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }

#staffMenu button {
  background: #1b2354;
  color: var(--ink);
  border: 1px solid #2f3d86;
  border-radius: 6px;
  padding: 9px 12px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
#staffMenu button:hover { background: #26308f; }
#staffMenu button.primary { background: #2f57d8; border-color: #4c74ff; }

.staff-pads {
  margin: 14px 0 0;
  padding: 8px 10px;
  max-height: 120px;
  overflow: auto;
  border: 1px solid #2a3466;
  border-radius: 6px;
  background: rgba(5, 8, 24, .8);
  color: var(--calm);
  font: 11px/1.5 "Courier New", monospace;
  white-space: pre-wrap;
  word-break: break-all;
}
.staff-hint { font-size: 11px; opacity: .55; margin: 14px 0 0; line-height: 1.6; }

/* ---------------- 載入 ---------------- */

#loading {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #000;
  color: var(--calm);
  font-size: 15px;
  z-index: 99;
}

</style>
</head>
<body>

<div id="stage">
  <div id="frame">

    <div id="hud">
      <div class="hud-left">
        <span class="hud-label">時間</span>
        <span id="time">00</span>
      </div>
      <div class="hud-mid">
        <div class="progress"><div id="progressFill"></div></div>
        <div class="hud-stats">
          <span>分數 <b id="tokens">0</b></span>
          <span class="hud-soothe">安撫 <span id="soothedSlots"></span></span>
        </div>
      </div>
      <div class="hud-players" id="playerBars"></div>
    </div>

    <div id="canvasWrap">
      <canvas id="game"></canvas>

      <div id="goalHint" class="goal-hint"></div>
      <div id="hitFlash"></div>
      <div id="timeWarning" class="floating top"></div>
      <div id="controllerNote" class="floating top2"></div>
      <div id="gentleTip" class="floating bottom"></div>

      <div class="panel" id="attractPanel">
        <div class="attract-title" id="attractSlogan"></div>
        <div class="attract-sub">情緒探索迷宮</div>
        <ul class="menu" id="attractMenu"></ul>
        <div class="attract-prompt" id="attractPrompt"></div>
        <div class="attract-hint">方向鍵 / WASD、藍牙手掣，或者喺畫面上掃</div>
      </div>

      <div class="panel" id="charactersPanel">
        <div class="sub-title" id="charactersTitle"></div>
        <div class="char-cards" id="charCards"></div>
        <div class="sub-footer" id="charactersFooter"></div>
        <div class="sub-hint" id="charactersBack"></div>
      </div>

      <div class="panel" id="controllersPanel">
        <div class="sub-title" id="controllersTitle"></div>

// ===== engine.js =====
// 引擎層：素材載入、音效、輸入、迷宮、玩家、情緒角色、單局狀態
// 全部用 classic script（唔用 ES module），令 file:// 直接開都跑得到。

const TILE = 24;                    // 每格邏輯像素
const PLAYER_SPEED = 5.625 * TILE;  // 5.625 格/秒（沿用 Godot 版 90px/s @ 16px tile）
const SPRITE_DRAW = TILE * 1.45;    // sprite 畫幾大
const ANIM_FPS = 8;

const PLAYER_COLORS = ['#ffd93d', '#4dd6ff', '#ff8fc7', '#9dff8f'];

// ---------------------------------------------------------------------------
// 素材
// ---------------------------------------------------------------------------

const Assets = {
  images: {},
  _pending: 0,

  load(onDone) {
    const list = [];
    const states = { scatter: 2, chase: 2, vulnerable: 2, caught_gentle: 4, resting: 2 };
    for (const c of GAME_DATA.characters) {
      for (const [state, count] of Object.entries(states)) {
        for (let i = 1; i <= count; i++) {
          list.push([`${c.id}_${state}_${String(i).padStart(2, '0')}`,
            `assets/sprites/emotion_characters/${c.id}_${state}_${String(i).padStart(2, '0')}.png`]);
        }
      }
    }
    for (const anim of ['idle', 'move_up', 'move_down', 'move_left', 'move_right']) {
      for (let i = 1; i <= 4; i++) {
        list.push([`player_${anim}_${String(i).padStart(2, '0')}`,
          `assets/sprites/player/player_${anim}_${String(i).padStart(2, '0')}.png`]);
      }
    }

    this._pending = list.length;
    if (this._pending === 0) { onDone(); return; }
    for (const [key, src] of list) {
      const img = new Image();
      img.onload = img.onerror = () => { if (--this._pending === 0) onDone(); };
      img.src = SPRITE_DATA[src] || src;
      this.images[key] = img;
    }
  },

  // 逐格動畫：frames 係 1-based 檔案編號陣列
  frame(prefix, frames, timeSec) {
    const idx = frames[Math.floor(timeSec * ANIM_FPS) % frames.length];
    return this.images[`${prefix}_${String(idx).padStart(2, '0')}`];
  }
};

// ---------------------------------------------------------------------------
// 音效：用 WebAudio 即時合成柔和 chiptune，唔需要外部音檔
// child-mh-consultant 條件：唔用刺耳/驚嚇音效，全部限低音量、柔和波形
// ---------------------------------------------------------------------------

const Sfx = {
  ctx: null,
  enabled: true,

  _ensure() {
    if (!this.enabled) return null;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.enabled = false; return null; }
      this.ctx = new AC();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },

  // notes: [[頻率, 開始秒, 長度秒], ...]
  _play(notes, { type = 'triangle', gain = 0.12 } = {}) {
    const ctx = this._ensure();
    if (!ctx) return;
    const now = ctx.currentTime;
    for (const [freq, start, dur] of notes) {
      const osc = ctx.createOscillator();
      const env = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      env.gain.setValueAtTime(0, now + start);
      env.gain.linearRampToValueAtTime(gain, now + start + 0.02);
      env.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
      osc.connect(env).connect(ctx.destination);
      osc.start(now + start);
      osc.stop(now + start + dur + 0.05);
    }
  },

  tokenPickup() { this._play([[880, 0, 0.08]], { gain: 0.05 }); },
  powerPickup() { this._play([[523, 0, 0.1], [659, 0.08, 0.1], [784, 0.16, 0.2]], { gain: 0.09 }); },
  pursuitMode() { this._play([[392, 0, 0.5], [494, 0, 0.5]], { type: 'sine', gain: 0.06 }); },
  calmSuccess() { this._play([[784, 0, 0.15], [659, 0.12, 0.15], [523, 0.24, 0.35]], { type: 'sine', gain: 0.1 }); },
  playerCaught() { this._play([[330, 0, 0.18], [262, 0.14, 0.25]], { type: 'sine', gain: 0.07 }); },
  timeWarning() { this._play([[587, 0, 0.2], [587, 0.28, 0.3]], { type: 'sine', gain: 0.07 }); },
  gameOver() { this._play([[392, 0, 0.25], [330, 0.22, 0.25], [262, 0.44, 0.5]], { type: 'sine', gain: 0.08 }); },
  levelClear() { this._play([[523, 0, 0.14], [659, 0.13, 0.14], [784, 0.26, 0.14], [1047, 0.39, 0.4]], { gain: 0.1 }); },
  uiConfirm() { this._play([[660, 0, 0.07]], { gain: 0.05 }); }
};

// ---------------------------------------------------------------------------
// 輸入：鍵盤 + Gamepad API（最多 4 人，支援 hot-plug）
// ---------------------------------------------------------------------------

const STICK_ON = 0.5;          // 搖桿撳到幾耐先算開始郁
const STICK_OFF = 0.35;        // 郁緊之後放到幾細先算放手
const STICK_REST_MAX = 0.6;    // 靜止值喺 ±0.6 以內先當漂移去校正

const Input = {
  keys: {},
  _confirmEdge: false,
  _pads: [null, null, null, null],   // slot -> gamepad index
  _prevConfirm: [false, false, false, false],
  _prevBack: [false, false, false, false],
  roundLimit: 0,         // 進行緊嘅一局開局時鎖低嘅人數上限（唔喺局中 = 0）
  onPlayerJoined: null,
  onPlayerLeft: null,

  init(canvas) {
    addEventListener('keydown', (e) => {
      this.keys[e.key.toLowerCase()] = true;
      if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();
    });
    addEventListener('keyup', (e) => { this.keys[e.key.toLowerCase()] = false; });
    addEventListener('blur', () => { this.keys = {}; });

    addEventListener('gamepadconnected', (e) => this._assign(e.gamepad.index));
    addEventListener('gamepaddisconnected', (e) => this._remove(e.gamepad.index));

    this._initTouch(canvas);
    // 攤位有時淨係得 mouse／trackpad，撳一下畫面等於撳確認掣
    canvas.addEventListener('mousedown', () => { this._keyConfirmEdge = true; });
  },

  // 觸控螢幕攤位：喺畫面上掃一下控制 P1
  _initTouch(canvas) {
    let sx = 0, sy = 0;
    canvas.addEventListener('touchstart', (e) => {
      sx = e.touches[0].clientX; sy = e.touches[0].clientY;
      this._touchConfirm = true;
    }, { passive: true });
    canvas.addEventListener('touchend', (e) => {
      const t = e.changedTouches[0];
      const dx = t.clientX - sx, dy = t.clientY - sy;
      if (Math.hypot(dx, dy) < 24) return;
      this._touchDir = Math.abs(dx) > Math.abs(dy)
        ? { x: Math.sign(dx), y: 0 }
        : { x: 0, y: Math.sign(dy) };
    }, { passive: true });
  },
  _touchDir: null,
  _touchConfirm: false,

  _assign(padIndex) {
    if (this._pads.includes(padIndex)) return;
    const slot = this._pads.indexOf(null);
    // 局進行中：上限用「開局時鎖低嘅」同現時設定較大嗰個，等局中途調低上限都唔會令已入局嘅玩家斷線後接唔返
    const limit = Math.max(GAME_DATA.config.max_players, this.roundLimit || 0);
    if (slot === -1 || slot >= limit) return;
    this._pads[slot] = padIndex;
    if (this.onPlayerJoined) this.onPlayerJoined(slot);
  },

  _remove(padIndex) {
    const slot = this._pads.indexOf(padIndex);
    if (slot === -1) return;
    delete this._neutral[padIndex];   // 同一個 index 換咗另一隻手掣，唔可以沿用舊手掣嘅校正值
    this._pads[slot] = null;
    if (this.onPlayerLeft) this.onPlayerLeft(slot);
  },

  _pad(slot) {
    const idx = this._pads[slot];
    if (idx === null) return null;
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    return pads[idx] || null;
  },

  // 實際會入局嘅玩家數：只計喺「人數上限」以內嘅手掣
  // （之前計晒所有已連接手掣，所以調低人數上限完全冇效）。
  // limit：一局開始時鎖低嘅上限；唔傳就用現時志工設定。
  activePlayerCount(limit = GAME_DATA.config.max_players) {
    const n = this._pads.filter((p, slot) => p !== null && slot < limit).length;
    return n;
  },

  // 手掣有冇插住（唔理人數上限，手掣連接畫面用）
  isSlotConnected(slot) { return this._pads[slot] !== null; },

  // 手掣有插住，而且喺人數上限以內：呢位玩家先可以入局
  isSlotActive(slot, limit = GAME_DATA.config.max_players) { return this._pads[slot] !== null && slot < limit; },

  // 手掣型號名（Switch 式手掣畫面顯示用），太長就截短
  padName(slot) {
    const pad = this._pad(slot);
    if (!pad) return '';
    return String(pad.id).replace(/\s*\([^)]*\)\s*/g, ' ').trim().slice(0, 22) || 'Gamepad';
  },

  // 而家有冇郁緊呢隻手掣：俾志工撳一下就認到邊隻手掣係邊個玩家
  padActivity(slot) {
    const pad = this._pad(slot);
    if (!pad) return false;
    if (pad.buttons.some((b) => b.pressed)) return true;
    // 只睇校正後嘅左搖桿；其他軸（例如部分手掣嘅扳機靜止值係 -1）唔計，否則會常亮
    const [ax, ay] = this._calibratedStick(pad);
    return Math.hypot(ax, ay) >= STICK_ON;
  },

  // ---- 搖桿校正 + 死區 ----
  // 唔少手掣（尤其用耐咗嘅）搖桿放開時唔係剛好 0，會有少少「漂移」，
  // 死區太細就會令玩家自己行。做法：
  //  1. 手掣被偵測到嗰陣，記低搖桿靜止值當作 0 點（只接受漂移範圍內嘅值，企定喺邊都唔當 0）
  //  2. 啟動門檻 STICK_ON（0.5），放開門檻 STICK_OFF（0.35）：撳到夠力先郁，郁緊嗰陣可以輕少少，
  //     避免喺門檻邊緣一郁一停
  _neutral: {},          // gamepad index -> [x, y]
  _stickOn: [false, false, false, false],

  _calibrate(pad) {
    const rest = (v) => (Number.isFinite(v) && Math.abs(v) <= STICK_REST_MAX ? v : 0);
    this._neutral[pad.index] = [rest(pad.axes[0]), rest(pad.axes[1])];
  },

  _calibratedStick(pad) {
    const n = this._neutral[pad.index] || [0, 0];
    const fin = (v) => (Number.isFinite(v) ? v : 0);
    // 減去靜止值之後，按各方向剩低嘅行程拉返去 -1..1（靜止值偏向某邊，嗰邊行程變短，唔拉返就撳唔夠力）
    const axis = (v, rest) => {
      const d = fin(v) - rest;
      const room = d >= 0 ? 1 - rest : 1 + rest;
      return room > 0.2 ? Math.max(-1, Math.min(1, d / room)) : d;
    };
    return [axis(pad.axes[0], n[0]), axis(pad.axes[1], n[1])];
  },

  // 每 frame 掃描一次，補捉未經 event 通知嘅手掣（部分瀏覽器要先撳掣先報 connected）
  poll() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < pads.length; i++) {
      if (pads[i] && pads[i].connected) this._assign(i);
    }
    for (const slot of [0, 1, 2, 3]) {
      const idx = this._pads[slot];
      if (idx !== null && (!pads[idx] || !pads[idx].connected)) this._remove(idx);
    }
    // 新入嘅手掣校正搖桿；已經走咗嘅手掣清除校正值，下次插返重新校正
    for (let i = 0; i < pads.length; i++) {
      const assigned = this._pads.includes(i);
      if (assigned && pads[i] && !(i in this._neutral)) this._calibrate(pads[i]);
      if (!assigned) delete this._neutral[i];
    }
  },

  moveVector(slot) {
    const pad = this._pad(slot);
    let x = 0, y = 0;
    if (pad) {
      const [ax, ay] = this._calibratedStick(pad);
      const mag = Math.hypot(ax, ay);
      this._stickOn[slot] = mag >= (this._stickOn[slot] ? STICK_OFF : STICK_ON);
      if (this._stickOn[slot]) { x = ax; y = ay; }
      if (pad.buttons[12] && pad.buttons[12].pressed) y = -1;
      else if (pad.buttons[13] && pad.buttons[13].pressed) y = 1;
      if (pad.buttons[14] && pad.buttons[14].pressed) x = -1;
      else if (pad.buttons[15] && pad.buttons[15].pressed) x = 1;
    }
    if (slot === 0 && x === 0 && y === 0) {
      const k = this.keys;
      if (k['arrowleft'] || k['a']) x = -1;
      else if (k['arrowright'] || k['d']) x = 1;
      if (k['arrowup'] || k['w']) y = -1;
      else if (k['arrowdown'] || k['s']) y = 1;
      if (x === 0 && y === 0 && this._touchDir) {
        const d = this._touchDir; this._touchDir = null;
        return d;
      }
    }
    return { x, y };
  },

  // 任何一個玩家（或鍵盤）撳落確認掣嗰一 frame
  // confirmSlots：今個 frame 邊幾隻手掣撳咗；confirmOther：鍵盤／觸控／mouse 撳咗
  // （高分榜入名只認得獎玩家嘅手掣，要知係邊個撳）
  confirmSlots: [],
  confirmOther: false,
  confirmJustPressed() {
    let pressed = false;
    this.confirmSlots = [];
    this.confirmOther = false;
    for (const slot of [0, 1, 2, 3]) {
      const pad = this._pad(slot);
      const down = !!(pad && pad.buttons[0] && pad.buttons[0].pressed);
      if (down && !this._prevConfirm[slot]) { pressed = true; this.confirmSlots.push(slot); }
      this._prevConfirm[slot] = down;
    }
    if (this._keyConfirmEdge) { pressed = true; this.confirmOther = true; this._keyConfirmEdge = false; }
    if (this._touchConfirm) { pressed = true; this.confirmOther = true; this._touchConfirm = false; }
    return pressed;
  },

  // 手掣上某粒掣（按標準 Gamepad 對應：1 = B、9 = Start）今個 frame 剛剛撳落
  _prevBtn: {},
  padButtonEdge(slot, idx) {
    const pad = this._pad(slot);
    const down = !!(pad && pad.buttons[idx] && pad.buttons[idx].pressed);
    const key = `${slot}:${idx}`;
    const edge = down && !this._prevBtn[key];
    this._prevBtn[key] = down;
    return edge;
  },
  _keyConfirmEdge: false,

  // 兩隻或以上手掣同時撳住 Back/Select（志工設定入口）
  backHeldCount() {
    let n = 0;
    for (const slot of [0, 1, 2, 3]) {
      const pad = this._pad(slot);
      if (pad && pad.buttons[8] && pad.buttons[8].pressed) n++;
    }
    return n;
  }
};

addEventListener('keydown', (e) => {
  if (e.repeat) return;
  if (e.key === 'Enter' || e.key === ' ') Input._keyConfirmEdge = true;
});

// 迷宮
// ---------------------------------------------------------------------------

const Maze = {
  width: 0, height: 0,
  walls: null,            // Set of "x,y"
  tokens: null,           // Set of "x,y"，收集後移除
  pellets: null,
  totalTokens: 0,
  tunnelRow: -1,
  ghostHouse: null,
  homeGrid: null,

  reset() {
    const L = GAME_DATA.level;
    this.width = L.grid_width;
    this.height = L.grid_height;
    this.tunnelRow = L.tunnel_row;
    this.ghostHouse = L.ghost_house.rect;
    this.homeGrid = L.ghost_house.home_position_grid;
    this.walls = new Set();
    this.tokens = new Set();
    this.pellets = new Set();

    L.grid.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const key = `${x},${y}`;
        if (row[x] === '#') this.walls.add(key);
        else if (row[x] === '.') this.tokens.add(key);
        else if (row[x] === 'o') this.pellets.add(key);
      }
    });
    this.totalTokens = this.tokens.size;
  },

  isWall(gx, gy) {
    if (gy === this.tunnelRow && (gx < 0 || gx >= this.width)) return false; // 隧道出口
    if (gx < 0 || gy < 0 || gx >= this.width || gy >= this.height) return true;
    return this.walls.has(`${gx},${gy}`);
  },

  requiredTokens() {
    return Math.round(this.totalTokens * GAME_DATA.level.completion_token_percent);
  },

  centerOf(gx, gy) {
    return { x: (gx + 0.5) * TILE, y: (gy + 0.5) * TILE };
  },

  gridOf(px, py) {
    return { gx: Math.floor(px / TILE), gy: Math.floor(py / TILE) };
  }
};

// ---------------------------------------------------------------------------
// 格心移動基底：所有角色都喺格心先決定下一步，避免斜行/穿牆
// ---------------------------------------------------------------------------

class GridMover {
  constructor(gx, gy) {
    const c = Maze.centerOf(gx, gy);
    this.x = c.x; this.y = c.y;
    this.dir = { x: 0, y: 0 };
    this.tx = c.x; this.ty = c.y;
    this.moving = false;
    this.speed = PLAYER_SPEED;
  }

  get grid() { return Maze.gridOf(this.x, this.y); }

  canMove(dir) {
    const g = this.grid;
    return !Maze.isWall(g.gx + dir.x, g.gy + dir.y);
  }

  commit(dir) {
    this.dir = dir;
    const g = this.grid;
    const c = Maze.centerOf(g.gx + dir.x, g.gy + dir.y);
    this.tx = c.x; this.ty = c.y;
    this.moving = true;
  }

  // 行剩落嘅距離會帶去下一格，唔會因為 frame 邊界而扣速
  step(dt) {
    let remaining = this.speed * dt;
    let guard = 0;
    while (remaining > 0 && guard++ < 8) {
      if (!this.moving) {
        this.decide();
        if (!this.moving) break;
      }
      const dx = this.tx - this.x, dy = this.ty - this.y;
      const dist = Math.hypot(dx, dy);
      if (dist <= remaining) {
        this.x = this.tx; this.y = this.ty;
        remaining -= dist;
        this.moving = false;
        this._wrapTunnel();
        this.onArrive();
      } else {
        this.x += (dx / dist) * remaining;
        this.y += (dy / dist) * remaining;
        remaining = 0;
      }
    }
  }

  _wrapTunnel() {
    const g = this.grid;
    if (g.gy !== Maze.tunnelRow) return;
    if (g.gx < 0) {
      const c = Maze.centerOf(Maze.width - 1, Maze.tunnelRow);
      this.x = c.x; this.y = c.y; this.tx = c.x; this.ty = c.y;
    } else if (g.gx >= Maze.width) {
      const c = Maze.centerOf(0, Maze.tunnelRow);
      this.x = c.x; this.y = c.y; this.tx = c.x; this.ty = c.y;
    }
  }

  // 喺格心可以行嘅方向；exclude_reverse = 唔准即時 180 度掉頭（除非死路）
  availableDirs(excludeReverse) {
    const dirs = [{ x: 0, y: -1 }, { x: 0, y: 1 }, { x: -1, y: 0 }, { x: 1, y: 0 }];
    const out = dirs.filter((d) => {
      if (excludeReverse && (this.dir.x || this.dir.y) && d.x === -this.dir.x && d.y === -this.dir.y) return false;
      return this.canMove(d);
    });
    if (out.length === 0 && (this.dir.x || this.dir.y)) {
      const rev = { x: -this.dir.x, y: -this.dir.y };
      if (this.canMove(rev)) out.push(rev);
    }
    return out;
  }

  chooseTowards(targetX, targetY, excludeReverse) {
    const options = this.availableDirs(excludeReverse);
    if (options.length === 0) return;
    let best = options[0], bestDist = Infinity;
    for (const d of options) {
      const nx = this.x + d.x * TILE, ny = this.y + d.y * TILE;
      const dist = Math.hypot(targetX - nx, targetY - ny);
      if (dist < bestDist) { bestDist = dist; best = d; }
    }
    this.commit(best);
  }

  decide() {}
  onArrive() {}
}

// ---------------------------------------------------------------------------
// 玩家
// ---------------------------------------------------------------------------

class Player extends GridMover {
  constructor(slot, gx, gy) {
    super(gx, gy);
    this.slot = slot;
    this.queued = { x: 0, y: 0 };
    this.connected = true;
    this.gentlyResetTimer = 0;   // > 0 代表被掂到之後嘅短暫無敵時間
    this.animTime = 0;
    this.nearEmotion = false;    // GDD 9.1.4a：貼近情緒角色時鎖住大張口幀

    // 生命：被未進入安撫模式嘅情緒角色掂到扣一條，唔會自動回復；
    // 扣到零就出局（out），畫面變灰、唔再郁。全部玩家出局 = Game Over。
    this.lives = GAME_DATA.config.lives;
    this.out = false;
  }

  update(dt) {
    if (!this.connected || this.out) return;
    this.animTime += dt;
    if (this.gentlyResetTimer > 0) this.gentlyResetTimer -= dt;

    const v = Input.moveVector(this.slot);
    if (v.x || v.y) {
      this.queued = Math.abs(v.x) > Math.abs(v.y)
        ? { x: Math.sign(v.x), y: 0 }
        : { x: 0, y: Math.sign(v.y) };
    }
    this.step(dt);
  }

  decide() {
    // 轉彎緩衝：提前撳嘅方向一到格心即刻生效
    if ((this.queued.x || this.queued.y) && this.canMove(this.queued)) {
      this.commit(this.queued);
    } else if ((this.dir.x || this.dir.y) && this.canMove(this.dir)) {
      this.commit(this.dir);
    }
  }

  onArrive() {
    if (this.onCellReached) this.onCellReached(this);
  }

  isProtected() { return this.gentlyResetTimer > 0; }

  // 被未進入安撫模式嘅情緒角色掂到：扣一條命，唔會回復。
  // 扣完仍然有命就有一段短無敵時間（避免連環被掂）；扣到零就出局。
  // 回傳 true = 今次真係扣咗命。
  hit() {
    if (this.out || this.isProtected()) return false;
    this.lives = Math.max(0, this.lives - 1);
    if (this.lives === 0) this.out = true;
    else this.gentlyResetTimer = GAME_DATA.config.hit_protect_seconds;
    return true;
  }

  sprite() {
    let anim = 'player_idle';
    if (this.moving) {
      if (this.dir.x > 0) anim = 'player_move_right';
      else if (this.dir.x < 0) anim = 'player_move_left';
      else if (this.dir.y > 0) anim = 'player_move_down';
      else if (this.dir.y < 0) anim = 'player_move_up';
    }
    // 貼近／面向／重疊情緒角色時，只准用閉口(01)同細張口(02/04)幀，
    // 唔可以播最大張口嘅 03 幀 —— GDD 9.1.4a CRITICAL 構圖規則
    const frames = this.nearEmotion ? [1, 2, 4] : [1, 2, 3, 4];
    return Assets.frame(anim, frames, this.animTime);
  }
}

// ---------------------------------------------------------------------------
// 情緒角色
// 狀態機：SCATTER -> CHASE -> VULNERABLE -> CAUGHT -> RESTING -> CHASE
// ---------------------------------------------------------------------------

const CharState = { SCATTER: 'scatter', CHASE: 'chase', VULNERABLE: 'vulnerable', CAUGHT: 'caught_gentle', RESTING: 'resting' };

class EmotionCharacter extends GridMover {
  constructor(data, gx, gy) {
    super(gx, gy);
    this.id = data.id;
    this.nameZh = data.name_zh;
    this.behavior = data.chase_behavior;
    this.caughtLine = data.caught_line_zh;
    this.baseSpeed = PLAYER_SPEED * data.base_speed_mult;
    this.scatterTarget = this._cornerWorld(data.scatter_corner);
    this.home = Maze.centerOf(Maze.homeGrid.x, Maze.homeGrid.y);
    this.state = CharState.SCATTER;
    this.stateTimer = 5;
    this.animTime = 0;
    this.decisionTick = 0;
    this.orbitAngle = 0;
    this.targetPlayer = null;
  }

  _cornerWorld(name) {
    const w = Maze.width, h = Maze.height;
    const map = {
      top_left: [1, 1], top_right: [w - 2, 1],
      bottom_left: [1, h - 2], bottom_right: [w - 2, h - 2]
    };
    const [gx, gy] = map[name] || [1, 1];
    return Maze.centerOf(gx, gy);
  }

  get isVulnerable() { return this.state === CharState.VULNERABLE; }
  get isActiveChaser() { return this.state === CharState.SCATTER || this.state === CharState.CHASE; }

  currentSpeed() {
    // 全程唔會突然加速（child-mh-consultant 條件：唔用 jump-scare 式追近）
    return this.state === CharState.VULNERABLE ? this.baseSpeed * 0.6 : this.baseSpeed;
  }

  update(dt, players) {
    this.animTime += dt;
    this.players = players;
    this.speed = this.currentSpeed();

    switch (this.state) {
      case CharState.SCATTER:
        this.step(dt);
        if ((this.stateTimer -= dt) <= 0) this.enter(CharState.CHASE);
        break;
      case CharState.CHASE:
        this.step(dt);
        break;
      case CharState.VULNERABLE:
        this.step(dt);
        if ((this.stateTimer -= dt) <= 0) this.enter(CharState.CHASE);
        break;
      case CharState.CAUGHT:
        // 溫暖光圈動畫期間唔郁，時間到就返情緒屋休息
        if ((this.stateTimer -= dt) <= 0) this.enter(CharState.RESTING);
        break;
      case CharState.RESTING:
        this.step(dt);
        if ((this.stateTimer -= dt) <= 0) this.enter(CharState.CHASE);
        break;
    }
  }

  enter(state) {
    this.state = state;
    if (state === CharState.SCATTER) this.stateTimer = 5;
    else if (state === CharState.VULNERABLE) this.stateTimer = GAME_DATA.sharedRules.vulnerable_duration_seconds;
    else if (state === CharState.CAUGHT) {
      this.stateTimer = 1.2;
      this.moving = false;
      this.dir = { x: 0, y: 0 };
    } else if (state === CharState.RESTING) this.stateTimer = GAME_DATA.sharedRules.resting_duration_seconds;
  }

  enterVulnerable() {
    if (this.state === CharState.CAUGHT || this.state === CharState.RESTING) return;
    this.enter(CharState.VULNERABLE);
  }

  nearestPlayer() {
    let best = null, bestDist = Infinity;
    for (const p of this.players || []) {
      const d = Math.hypot(p.x - this.x, p.y - this.y);
      if (d < bestDist) { bestDist = d; best = p; }
    }
    return best;
  }

  decide() {
    if (this.state === CharState.SCATTER) {
      this.chooseTowards(this.scatterTarget.x, this.scatterTarget.y, true);
      return;
    }
    if (this.state === CharState.RESTING) {
      this.chooseTowards(this.home.x, this.home.y, true);
      return;
    }
    const player = this.nearestPlayer();
    if (!player) return;

    if (this.state === CharState.VULNERABLE) {
      // 安撫模式：慢落嚟同時遠離玩家，行為可預期，等小朋友追得到
      const away = { x: this.x - player.x, y: this.y - player.y };
      const len = Math.hypot(away.x, away.y) || 1;
      this.chooseTowards(this.x + (away.x / len) * TILE * 4, this.y + (away.y / len) * TILE * 4, true);
      return;
    }

    switch (this.behavior) {
      case 'slow_follow': {
        // 藍藍：兩格先重新決策一次，令佢慢慢跟唔會咬到實
        this.decisionTick++;
        const options = this.availableDirs(true);
        const keep = options.find((d) => d.x === this.dir.x && d.y === this.dir.y);
        if (this.decisionTick % 2 !== 0 && keep) this.commit(keep);
        else this.chooseTowards(player.x, player.y, true);
        break;
      }
      case 'erratic_but_gentle': {
        // 驚驚：七成追、三成隨機，忽遠忽近但唔會突然衝刺
        if (Math.random() < 0.7) this.chooseTowards(player.x, player.y, true);
        else {
          const options = this.availableDirs(true);
          if (options.length) this.commit(options[Math.floor(Math.random() * options.length)]);
        }
        break;
      }
      case 'orbit_player': {
        // 擔心蟲：喺玩家周圍團團轉，唔直衝
        this.orbitAngle = (this.orbitAngle + 0.6) % (Math.PI * 2);
        const r = TILE * 3;
        this.chooseTowards(player.x + Math.cos(this.orbitAngle) * r, player.y + Math.sin(this.orbitAngle) * r, true);
        break;
      }
      default:
        this.chooseTowards(player.x, player.y, true);
    }
  }

  sprite() {
    const counts = { scatter: 2, chase: 2, vulnerable: 2, caught_gentle: 4, resting: 2 };
    const n = counts[this.state] || 2;
    const frames = Array.from({ length: n }, (_, i) => i + 1);
    return Assets.frame(`${this.id}_${this.state}`, frames, this.animTime);
  }
}

// ---------------------------------------------------------------------------
// 單局狀態：倒數、團隊共用進度、個人分數
// ---------------------------------------------------------------------------

class Session {
  constructor() {
    this.timeLeft = GAME_DATA.config.session_duration_seconds;
    // 一局開始時鎖低人數上限：局中途改志工設定唔會影響呢一局（下一局先生效）
    this.playerLimit = GAME_DATA.config.max_players;
    this.running = true;
    this.tokensCollected = 0;
    this.charactersSoothed = 0;
    this.soothedLog = [];     // 按次序記低每次安撫咗邊個角色（HUD 四格用）
    this.scores = [0, 0, 0, 0];
    this.warningFired = false;
    this.baseRequired = Maze.requiredTokens();
    this.requiredTokens = this.baseRequired;
    this.requiredSoothed = GAME_DATA.characters.length;
    this.teamWon = false;
    this.gameOver = false;   // true = 全部玩家命用晒而結束（唔係時間到）
    this.recalcRequired();
  }

  // 人數越多門檻按比例提高（鼓勵協作），但唔會低過單人基礎門檻
  recalcRequired() {
    const active = Math.max(Input.activePlayerCount(this.playerLimit), 1);
    this.requiredTokens = Math.max(this.baseRequired, Math.round(this.baseRequired * (0.6 + 0.2 * active)));
  }

  update(dt) {
    if (!this.running) return;
    this.timeLeft = Math.max(this.timeLeft - dt, 0);
    if (this.timeLeft <= 10 && !this.warningFired) {
      this.warningFired = true;
      if (this.onTimeLowWarning) this.onTimeLowWarning();
    }
    if (this.timeLeft <= 0) this.end(false);
  }

  onToken(slot) {
    this.tokensCollected++;
    this.scores[slot]++;
    this.checkWin();
  }

  onSoothed(slot, characterId) {
    this.charactersSoothed++;
    this.soothedLog.push(characterId);
    this.scores[slot] += 5;   // 安撫比收集代幣分數高，鼓勵主動安撫互動
    this.checkWin();
  }

  checkWin() {
    if (this.tokensCollected >= this.requiredTokens && this.charactersSoothed >= this.requiredSoothed) {
      this.end(true);
    }
  }

  end(teamWon, gameOver = false) {
    if (!this.running) return;
    this.running = false;
    this.teamWon = teamWon;
    this.gameOver = gameOver;
    if (this.onCompleted) this.onCompleted(teamWon);
  }

  topSlot() {
    let best = -1, bestScore = -1;
    for (let s = 0; s < 4; s++) {
      if (this.scores[s] > bestScore) { bestScore = this.scores[s]; best = s; }
    }
    return best;
  }
}

// ---------------------------------------------------------------------------
// 全日高分榜（localStorage，跨日自動重置）
// ---------------------------------------------------------------------------

const NAME_LENGTH = 5;
const NAME_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';   // 只准英文字母同數字

// 用部機本地時區嘅日期（例如香港時間），唔好用 toISOString()：
// 嗰個係 UTC 日期，香港早上 8 點先轉日，攤位一早開機玩過嘅分數會喺 8 點後重開時被清走
function localDateKey(d = new Date()) {
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

const HighScores = {
  KEY: 'emotion_maze_high_scores',
  MAX: 10,
  entries: [],

  load() {
    try {
      const raw = localStorage.getItem(this.KEY);
      const parsed = raw ? JSON.parse(raw) : null;
      const today = localDateKey();
      this.entries = (parsed && parsed.date === today && Array.isArray(parsed.entries)) ? parsed.entries : [];
    } catch (e) {
      this.entries = [];
    }
  },

  save() {
    try {
      localStorage.setItem(this.KEY, JSON.stringify({
        date: localDateKey(),
        entries: this.entries
      }));
    } catch (e) { /* 私隱模式下寫唔到就當今日唔記錄，唔影響遊玩 */ }
  },

  qualifies(score) {
    if (score <= 0) return false;
    if (this.entries.length < this.MAX) return true;
    return score > this.entries[this.entries.length - 1].score;
  },

  submit(name, score) {
    const clean = name.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, NAME_LENGTH);
    this.entries.push({ name: clean || 'PLAYER'.slice(0, NAME_LENGTH), score });
    this.entries.sort((a, b) => b.score - a.score);
    this.entries = this.entries.slice(0, this.MAX);
    this.save();
  },

  reset() { this.entries = []; this.save(); }
};

// ===== render.js =====
// Canvas 繪圖層：迷宮、代幣、角色、頭頂文字氣泡
// UI（HUD/面板/高分榜/設定）唔喺 canvas 畫，用 DOM，見 ui.js

const Render = {
  canvas: null,
  ctx: null,
  bubbles: [],   // 被安撫嗰刻喺角色頭頂浮現嘅敘事文案

  init(canvas) {
    this.canvas = canvas;
    this.canvas.width = Maze.width * TILE;
    this.canvas.height = Maze.height * TILE;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
  },

  addBubble(x, y, text) {
    this.bubbles.push({ x, y, text, t: 0 });
  },

  updateBubbles(dt) {
    for (const b of this.bubbles) b.t += dt;
    this.bubbles = this.bubbles.filter((b) => b.t < 1.5);
  },

  frame(state) {
    const ctx = this.ctx;
    this.playerCount = state.players.length;
    ctx.fillStyle = '#05060f';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    this.drawWalls();
    this.drawGhostHouse();
    this.drawTokens(state.time);
    for (const c of state.characters) this.drawCharacter(c);
    for (const p of state.players) this.drawPlayer(p);
    this.drawBubbles();
  },

  // 情緒屋（原 Ghost House）：情緒角色被安撫之後返嚟休息嘅地方，畫喺牆之後令標示睇得到
  drawGhostHouse() {
    const r = Maze.ghostHouse;
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(150, 120, 255, 0.13)';
    ctx.fillRect(r.x * TILE, r.y * TILE, r.width * TILE, r.height * TILE);
    ctx.strokeStyle = 'rgba(180, 160, 255, 0.35)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    ctx.strokeRect(r.x * TILE + 1, r.y * TILE + 1, r.width * TILE - 2, r.height * TILE - 2);
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(205, 195, 255, 0.7)';
    ctx.font = `${Math.round(TILE * 0.44)}px system-ui, "PingFang HK", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('情緒屋', (r.x + r.width / 2) * TILE, (r.y + r.height) * TILE - 5);
    ctx.restore();
  },

  // 經典街機雙線牆身：淨係喺「牆同走廊之間」嘅邊界畫線
  drawWalls() {
    const ctx = this.ctx;
    ctx.fillStyle = '#0b1030';
    ctx.strokeStyle = '#3f6dff';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    for (const key of Maze.walls) {
      const [gx, gy] = key.split(',').map(Number);
      const x = gx * TILE, y = gy * TILE;
      ctx.fillRect(x, y, TILE, TILE);
    }

    ctx.beginPath();
    for (const key of Maze.walls) {
      const [gx, gy] = key.split(',').map(Number);
      const x = gx * TILE, y = gy * TILE;
      const inset = 2;
      if (!Maze.isWall(gx, gy - 1)) { ctx.moveTo(x, y + inset); ctx.lineTo(x + TILE, y + inset); }
      if (!Maze.isWall(gx, gy + 1)) { ctx.moveTo(x, y + TILE - inset); ctx.lineTo(x + TILE, y + TILE - inset); }
      if (!Maze.isWall(gx - 1, gy)) { ctx.moveTo(x + inset, y); ctx.lineTo(x + inset, y + TILE); }
      if (!Maze.isWall(gx + 1, gy)) { ctx.moveTo(x + TILE - inset, y); ctx.lineTo(x + TILE - inset, y + TILE); }
    }
    ctx.stroke();
  },

  drawTokens(time) {
    const ctx = this.ctx;
    ctx.fillStyle = '#ffe9a8';
    for (const key of Maze.tokens) {
      const [gx, gy] = key.split(',').map(Number);
      const c = Maze.centerOf(gx, gy);
      ctx.beginPath();
      ctx.arc(c.x, c.y, TILE * 0.11, 0, Math.PI * 2);
      ctx.fill();
    }

    // 正面元氣丸：一呼一吸咁脹縮，同「深呼吸」意象呼應。
    // 要夠搶眼，細路先會主動去食：比普通代幣大三倍，外面再加一圈向外擴散嘅光環。
    const pulse = 0.85 + Math.sin(time * 2.6) * 0.15;
    const ringPhase = (time * 0.9) % 1;
    for (const key of Maze.pellets) {
      const [gx, gy] = key.split(',').map(Number);
      const c = Maze.centerOf(gx, gy);
      ctx.beginPath();
      ctx.arc(c.x, c.y, TILE * 0.62 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(120, 230, 255, 0.22)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(c.x, c.y, TILE * (0.4 + 0.5 * ringPhase), 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(160, 240, 255, ${0.9 * (1 - ringPhase)})`;
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(c.x, c.y, TILE * 0.32 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = '#d4f8ff';
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#6fdcff';
      ctx.stroke();
    }
  },

  // 每位玩家成個角色用自己顏色（P1 黃、P2 藍、P3 粉紅、P4 綠），一眼認到邊個係自己。
  // 原圖係黃色，用 hue-rotate 轉色；瀏覽器唔支援 canvas filter 就照用原圖（仍然有顏色描邊同標籤）。
  PLAYER_HUE: [0, 150, 280, 60],
  _tintCache: {},
  _tinted(img, slot) {
    const deg = this.PLAYER_HUE[slot] || 0;
    if (!deg) return img;
    const key = img.src + '|' + deg;
    if (this._tintCache[key]) return this._tintCache[key];
    const off = document.createElement('canvas');
    off.width = img.naturalWidth;
    off.height = img.naturalHeight;
    const c = off.getContext('2d');
    if (!('filter' in c)) return (this._tintCache[key] = img);
    c.imageSmoothingEnabled = false;
    c.filter = `hue-rotate(${deg}deg) saturate(1.3)`;
    c.drawImage(img, 0, 0);
    this._tintCache[key] = off;
    return off;
  },

  // 將 sprite 染成單色剪影，用嚟砌描邊；同一張圖同一個顏色只做一次
  _silhouetteCache: {},
  _silhouette(img, color) {
    const key = img.src + color;
    if (this._silhouetteCache[key]) return this._silhouetteCache[key];
    const off = document.createElement('canvas');
    off.width = img.naturalWidth;
    off.height = img.naturalHeight;
    const c = off.getContext('2d');
    c.drawImage(img, 0, 0);
    c.globalCompositeOperation = 'source-in';
    c.fillStyle = color;
    c.fillRect(0, 0, off.width, off.height);
    this._silhouetteCache[key] = off;
    return off;
  },

  // 玩家頭上嘅剩餘生命：細路眼睛望住迷宮，唔使望返去 HUD 都知仲有幾多條命
  drawLivesAbove(p, x, y) {
    const ctx = this.ctx;
    const max = GAME_DATA.config.lives;
    const size = TILE * 0.5;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.font = `bold ${size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const gap = size * 0.95;
    // 放喺玩家下面：上面已經有 P1/P2 標籤
    const cy = Math.min(Maze.height * TILE - size * 0.6, y + SPRITE_DRAW + size * 0.05);
    for (let i = 0; i < max; i++) {
      const cx = p.x + (i - (max - 1) / 2) * gap;
      ctx.fillStyle = i < p.lives ? '#ff5a7a' : 'rgba(255,255,255,0.18)';
      ctx.fillText('♥', cx, cy);
    }
    ctx.restore();
  },

  drawPlayer(p) {
    const ctx = this.ctx;
    ctx.save();
    // 出局：變灰；被掂到後嘅無敵時間：閃爍
    ctx.globalAlpha = p.out ? 0.25 : !p.connected ? 0.4
      : (p.isProtected() ? (Math.floor(p.animTime * 10) % 2 ? 0.35 : 0.9) : 1);

    const img = p.sprite();
    if (img && img.complete && img.naturalWidth) {
      const x = p.x - SPRITE_DRAW / 2, y = p.y - SPRITE_DRAW / 2;
      // 多人時每個玩家有專屬顏色描邊，小朋友先認到邊個係自己（GDD 4.3）
      if (this.playerCount > 1) {
        const outline = this._silhouette(img, PLAYER_COLORS[p.slot]);
        for (const [ox, oy] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) {
          ctx.drawImage(outline, x + ox, y + oy, SPRITE_DRAW, SPRITE_DRAW);
        }
      }
      ctx.drawImage(this._tinted(img, p.slot), x, y, SPRITE_DRAW, SPRITE_DRAW);
      if (!p.out) this.drawLivesAbove(p, x, y);
    }

    if (this.playerCount > 1 || !p.connected) {
      ctx.globalAlpha = 1;
      ctx.font = `bold ${Math.round(TILE * 0.4)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#05060f';
      ctx.strokeText(`P${p.slot + 1}`, p.x, p.y - TILE * 0.88);
      ctx.fillStyle = PLAYER_COLORS[p.slot];
      ctx.fillText(`P${p.slot + 1}`, p.x, p.y - TILE * 0.88);
    }
    ctx.restore();
  },

  drawCharacter(c) {
    const ctx = this.ctx;
    ctx.save();

    // 被安撫嗰一刻：溫暖光圈包住，唔用吞食/暴力視覺（child-mh-consultant 硬性要求）
    if (c.state === CharState.CAUGHT) {
      const p = 1 - c.stateTimer / 1.2;
      const grad = ctx.createRadialGradient(c.x, c.y, TILE * 0.15, c.x, c.y, TILE * (0.7 + p * 0.6));
      grad.addColorStop(0, 'rgba(255, 236, 180, 0.85)');
      grad.addColorStop(1, 'rgba(255, 210, 130, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(c.x, c.y, TILE * (0.7 + p * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }

    if (c.state === CharState.VULNERABLE) {
      // 尾段閃爍提示安撫模式就快完
      const flash = c.stateTimer < 2 && Math.floor(c.stateTimer * 6) % 2 === 0;
      ctx.globalAlpha = flash ? 0.55 : 1;
      const grad = ctx.createRadialGradient(c.x, c.y, TILE * 0.2, c.x, c.y, TILE * 0.8);
      grad.addColorStop(0, 'rgba(150, 235, 255, 0.55)');
      grad.addColorStop(1, 'rgba(150, 235, 255, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(c.x, c.y, TILE * 0.8, 0, Math.PI * 2);
      ctx.fill();
    } else if (c.state === CharState.RESTING) {
      ctx.globalAlpha = 0.6;
    }

    const img = c.sprite();
    if (img && img.complete && img.naturalWidth) {
      ctx.drawImage(img, c.x - SPRITE_DRAW / 2, c.y - SPRITE_DRAW / 2, SPRITE_DRAW, SPRITE_DRAW);
    }
    ctx.restore();
  },

  // ui_text.json caught_reaction_display：淡入 0.2s / 停留 1.1s / 淡出 0.2s
  drawBubbles() {
    const ctx = this.ctx;
    for (const b of this.bubbles) {
      let alpha = 1;
      if (b.t < 0.2) alpha = b.t / 0.2;
      else if (b.t > 1.3) alpha = Math.max(0, (1.5 - b.t) / 0.2);

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `${Math.round(TILE * 0.46)}px system-ui, "PingFang HK", sans-serif`;
      ctx.textAlign = 'center';
      const w = ctx.measureText(b.text).width + 14;
      const h = TILE * 0.8;
      let x = Math.min(Math.max(b.x, w / 2 + 4), this.canvas.width - w / 2 - 4);
      const y = Math.max(b.y - TILE * 1.1, h + 4);

      ctx.fillStyle = 'rgba(255, 248, 230, 0.94)';
      ctx.beginPath();
      ctx.roundRect(x - w / 2, y - h, w, h, 6);
      ctx.fill();
      ctx.fillStyle = '#3b2f1a';
      ctx.textBaseline = 'middle';
      ctx.fillText(b.text, x, y - h / 2);
      ctx.restore();
    }
  }
};

// ===== ui.js =====
// DOM UI：HUD、各個全螢幕面板、高分榜、志工設定
// 全部文案讀自 data.js，唔喺呢度寫死顯示字眼。

const $ = (id) => document.getElementById(id);

// [試驗] 用盡成個視窗：計 #frame 闊度，同埋按畫面大細放大 HUD／面板文字。
// 以前排版大約以 1000px 闊為準，所以用「實際闊度 ÷ 1000」做放大倍數。
const Layout = {
  BASE: 1000,
  HUD_BOOST: 1.0,     // HUD 跟畫面等比例放大
  PANEL_BOOST: 1.25,  // 面板字再大多 25%，遠啲都睇到
  fit() {
    const frame = $('frame'), hud = $('hud');
    if (!frame || !hud) return;
    const vw = innerWidth - 16, vh = innerHeight - 16, gap = 6, border = 4;
    const aspect = Maze.width / Maze.height;
    const root = document.documentElement.style;
    let w = vw;
    for (let i = 0; i < 3; i++) {   // HUD 高度會跟放大倍數變，行幾次就收斂
      root.setProperty('--ui-hud', Math.max(1, (w / this.BASE) * this.HUD_BOOST).toFixed(3));
      root.setProperty('--ui-panel', Math.max(1, (w / this.BASE) * this.PANEL_BOOST).toFixed(3));
      frame.style.width = w + 'px';
      const hudH = hud.getBoundingClientRect().height;
      w = Math.floor(Math.min(vw, (vh - hudH - gap - border) * aspect + border));
    }
    frame.style.width = w + 'px';
  }
};

    this.buildPreGameChars();

  // 開局前嘅精簡角色介紹：四個角色一行，每個只顯示「行緊 → 安撫成功」，
  // 以圖為主、字極少，6 秒睇得晒，任何掣即刻跳過（GDD 6.1.1 對 PRE-INFO 嘅限制）
  buildPreGameChars() {
    const box = $('preChars');
    const arrowLabel = GAME_DATA.uiText.character_intro.pre_game_arrow_label_zh;
    box.innerHTML = '';
    for (const c of GAME_DATA.characters) {
      const item = document.createElement('div');
      item.className = 'pre-char';
      const pair = document.createElement('div');
      pair.className = 'pre-pair';
      ['chase', 'caught_gentle'].forEach((state, i) => {
        if (i > 0) {
          const arrow = document.createElement('span');
          arrow.className = 'pre-arrow';
          arrow.textContent = '▶';
          pair.appendChild(arrow);
        }
        const img = document.createElement('img');
        const key = `${c.id}_${state}_01`;
        img.src = Assets.images[key] ? Assets.images[key].src : '';
        img.alt = c.name_zh;
        img.className = state === 'caught_gentle' ? 'soothed' : '';
        pair.appendChild(img);
      });
      item.appendChild(pair);
      const name = document.createElement('div');
      name.className = 'pre-name';
      name.textContent = c.name_zh;
      item.appendChild(name);
      box.appendChild(item);
    }
    const caption = document.createElement('div');
    caption.className = 'pre-caption';
    caption.textContent = `▶ ${arrowLabel}`;
    box.appendChild(caption);
  },

  // ---- 開始畫面選單 ----

  menuItems() {
    const M = GAME_DATA.uiText.attract_menu;
    return [
      { key: 'start', label: M.start_zh },
      { key: 'characters', label: M.characters_zh },
      { key: 'board', label: M.board_zh },
      { key: 'controllers', label: M.controllers_zh }
    ];
  },

  renderMenu(index) {
    const list = $('attractMenu');
    list.innerHTML = '';
    this.menuItems().forEach((item, i) => {
      const li = document.createElement('li');
      li.className = 'menu-item' + (i === index ? ' active' : '');
      li.textContent = item.label;
      list.appendChild(li);
    });
  },

  // ---- 角色介紹 ----
  // 逐個角色由「行緊」→「可以安撫」→「安撫成功」三個狀態並排，
  // 令小朋友玩之前就明白呢個轉變，唔會當佢哋係要打低嘅敵人。
  buildCharacterCards() {
    const L = GAME_DATA.uiText.character_intro.state_labels_zh;
    const box = $('charCards');
    box.innerHTML = '';
    for (const c of GAME_DATA.characters) {
      const card = document.createElement('div');
      card.className = 'char-card';

      const head = document.createElement('div');
      head.className = 'char-head';
      head.innerHTML = `<b>${c.name_zh}</b><span>${c.emotion}</span>`;
      card.appendChild(head);

      const strip = document.createElement('div');
      strip.className = 'char-strip';
      const states = [['chase', L.chase], ['vulnerable', L.vulnerable], ['caught_gentle', L.caught_gentle]];
      states.forEach(([state, label], i) => {
        if (i > 0) {
          const arrow = document.createElement('span');
          arrow.className = 'char-arrow';
          arrow.textContent = '▶';
          strip.appendChild(arrow);
        }
        const cell = document.createElement('div');
        cell.className = 'char-state' + (state === 'caught_gentle' ? ' soothed' : '');
        const img = document.createElement('img');
        // 用 Assets 已載入嘅 src，單一檔案版嗰陣呢度會係 data URI
        const key = `${c.id}_${state}_01`;
        img.src = Assets.images[key] ? Assets.images[key].src : '';
        img.alt = `${c.name_zh} ${label}`;
        cell.appendChild(img);
        const cap = document.createElement('span');
        cap.textContent = label;
        cell.appendChild(cap);
        strip.appendChild(cell);
      });
      card.appendChild(strip);

      const line = document.createElement('div');
      line.className = 'char-line';
      line.textContent = c.caught_line_zh;
      card.appendChild(line);

      box.appendChild(card);
    }
    this.buildTokenCard(box);
  },

  // 正面元氣丸格仔：放喺四張角色卡下面，成行闊，講每種情緒點安撫
  buildTokenCard(box) {
    const T = GAME_DATA.uiText.character_intro.token_card;
    if (!T) return;
    const card = document.createElement('div');
    card.className = 'char-card token-card';
    const head = document.createElement('div');
    head.className = 'token-head';
    head.innerHTML = '<i class="token-orb"></i>';
    const title = document.createElement('b');
    title.textContent = T.title_zh;
    head.appendChild(title);
    card.appendChild(head);
    const intro = document.createElement('div');
    intro.className = 'token-intro';
    intro.textContent = T.intro_zh;
    card.appendChild(intro);
    const list = document.createElement('ul');
    list.className = 'token-ways';
    for (const w of T.ways) {
      const li = document.createElement('li');
      const dot = document.createElement('i');
      dot.style.background = w.color;
      li.appendChild(dot);
      const span = document.createElement('span');
      span.textContent = w.text_zh;
      li.appendChild(span);
      list.appendChild(li);
    }
    card.appendChild(list);
    const foot = document.createElement('div');
    foot.className = 'token-foot';
    foot.textContent = T.footer_zh;
    card.appendChild(foot);
    box.appendChild(card);
  },

  // ---- 手掣連接（參考 Switch 嘅手掣畫面）----

  renderControllers() {
    const C = GAME_DATA.uiText.controllers_panel;
    // 狀態冇變就唔重砌 DOM，避免每 frame 重建
    const sig = [0, 1, 2, 3].map((s) =>
      `${Input.isSlotConnected(s) ? Input.padName(s) : ''}|${Input.padActivity(s) ? 1 : 0}`).join(';')
      + (Input.activePlayerCount() === 0 ? '|kb' : '');
    if (sig === this._padSig) return;
    this._padSig = sig;

    const box = $('padSlots');
    box.innerHTML = '';
    for (let slot = 0; slot < 4; slot++) {
      const connected = Input.isSlotConnected(slot);
      const keyboardFallback = slot === 0 && Input.activePlayerCount() === 0;
      const el = document.createElement('div');
      el.className = 'pad-slot'
        + (connected || keyboardFallback ? ' on' : '')
        + (Input.padActivity(slot) ? ' active' : '')
        + (slot + 1 > GAME_DATA.config.max_players ? ' disabled' : '');
      el.style.setProperty('--slot-color', PLAYER_COLORS[slot]);
      const label = connected ? Input.padName(slot) : (keyboardFallback ? C.keyboard_zh : C.empty_slot_zh);
      const status = connected ? C.connected_zh : (keyboardFallback ? C.connected_zh : '—');
      el.innerHTML = `<div class="pad-num">P${slot + 1}</div>`
        + `<div class="pad-icon"></div>`
        + `<div class="pad-name">${label}</div>`
        + `<div class="pad-status">${status}</div>`;
      box.appendChild(el);
    }
  },
  _padSig: null,

  showPanel(name) {
    for (const el of document.querySelectorAll('.panel')) {
      el.classList.toggle('visible', el.id === name);
    }
  },

  setHudVisible(v) { $('hud').classList.toggle('visible', v); },

  // 四格「已安撫」：每安撫一次就填一格，格內係嗰個角色安撫成功嘅樣。
  // 過關條件係安撫次數（requiredSoothed 次），所以按次序填格，而唔係逐個角色打剔。
  renderSoothedSlots(session) {
    const sig = session.soothedLog.join(',');
    if (sig === this._soothedSig) return;
    this._soothedSig = sig;
    const box = $('soothedSlots');
    box.innerHTML = '';
    for (let i = 0; i < session.requiredSoothed; i++) {
      const slot = document.createElement('span');
      const id = session.soothedLog[i];
      slot.className = 'soothe-slot' + (id ? ' done' : '');
      if (id) {
        const key = `${id}_caught_gentle_01`;
        const img = document.createElement('img');
        img.src = Assets.images[key] ? Assets.images[key].src : '';
        img.alt = '';
        slot.appendChild(img);
        const tick = document.createElement('i');
        tick.textContent = '✓';
        slot.appendChild(tick);
      }
      box.appendChild(slot);
    }
  },
  _soothedSig: null,

  updateHud(session) {
    $('time').textContent = String(Math.ceil(session.timeLeft)).padStart(2, '0');
    $('time').classList.toggle('low', session.timeLeft <= 10);
    const pct = session.requiredTokens > 0
      ? Math.min(100, (session.tokensCollected / session.requiredTokens) * 100) : 0;
    $('progressFill').style.width = pct + '%';
    this.renderSoothedSlots(session);
    // 中間顯示全隊總分；每位玩家自己嘅分數喺右邊佢個顏色格入面
    $('tokens').textContent = String(session.scores.reduce((a, b) => a + b, 0));
  },

  // 每位玩家一格，用佢專屬顏色：P 編號、個人分數、剩餘能量。
  // （2026-11 項目負責人要求每位玩家獨立計分同顯示，取代 GDD 4.3「局內唔顯示個人分數」）
  renderPlayerBars(players, scores = []) {
    const box = $('playerBars');
    const max = GAME_DATA.config.lives;
    const sig = players.map((p) =>
      `${p.slot}:${p.lives}:${p.connected ? 1 : 0}:${p.out ? 1 : 0}:${scores[p.slot] || 0}`).join('|');
    if (sig === this._playerSig) return;
    this._playerSig = sig;

    box.innerHTML = '';
    for (const p of players) {
      const el = document.createElement('div');
      el.className = 'pbar' + (p.connected ? '' : ' offline') + (p.out ? ' out' : '');
      el.style.setProperty('--c', PLAYER_COLORS[p.slot]);
      const hearts = Array.from({ length: max }, (_, i) =>
        `<i class="${i < p.lives ? 'on' : ''}">♥</i>`).join('');
      el.innerHTML = `<span class="pbar-head"><span class="pbar-name">P${p.slot + 1}</span>`
        + `<b class="pbar-score">${scores[p.slot] || 0}</b></span><span class="pbar-pips">${hearts}</span>`;
      box.appendChild(el);
    }
  },
  _playerSig: null,

  showTimeWarning() {
    const el = $('timeWarning');
    el.textContent = GAME_DATA.uiText.in_game.time_low_warning_zh;
    el.classList.add('visible');
  },

  hideTimeWarning() { $('timeWarning').classList.remove('visible'); },

  // 玩家被情緒角色掂到扣咗命：講明仲剩幾多條，最後一條同出局有各自嘅字
  showLifeLost(player, playerCount) {
    const T = GAME_DATA.uiText.in_game;
    const who = `P${player.slot + 1}`;
    this.hitFeedback();
    let text;
    if (player.out) text = T.player_out_zh.replace('{p}', who);
    else if (player.lives === 1) text = T.life_last_zh;
    else text = T.life_lost_zh.replace('{n}', player.lives);
    if (!player.out && playerCount > 1) text = `${who}　${text}`;
    this.showGentleTip(text, 2000);

  // 開局／食咗正面元氣丸嗰陣嘅大字目標提示
  showGoalHint(text, ms) {
    const el = $('goalHint');
    el.textContent = text;
    el.classList.add('visible');
    clearTimeout(this._goalTimer);
    this._goalTimer = setTimeout(() => el.classList.remove('visible'), ms);
